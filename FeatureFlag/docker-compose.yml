services:
  postgres:
    image: postgres:16-alpine
    container_name: featureflag-postgres
    environment:
      POSTGRES_DB: featureflag
      POSTGRES_USER: featureflag
      POSTGRES_PASSWORD: featureflag123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featureflag -d featureflag"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: featureflag-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  featureflag:
    build:
      context: ./FeatureFlag
      dockerfile: Dockerfile
    restart: on-failure
    container_name: featureflag-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=featureflag;Username=featureflag;Password=featureflag123"
    ports:
      - "5001:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
